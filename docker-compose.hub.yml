# Docker Hub のイメージだけで動かす場合の構成（ソース不要・PostgreSQL 付き）
#   POSTGRES_PASSWORD=<パスワード> SESSION_SECRET=$(openssl rand -hex 32) \
#     docker compose -f docker-compose.hub.yml up -d
# SQLite で使う場合は app の DATABASE_URL 行と db サービスを削除する
services:
  app:
    image: jkudo/event-scheduler:latest
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://confscheduler:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を指定してください}@db:5432/confscheduler
      # 未設定でも起動するが、再起動のたびにログインセッションが失効する
      SESSION_SECRET: ${SESSION_SECRET:-}
      # RESET_PASSWORD: ""    # データ初期化・復元用のパスワード（既定 password）
      # COOKIE_SECURE: "1"    # HTTPSのリバースプロキシ配下で明示する場合
    volumes:
      # アップロード画像・バックアップ・公開スナップショットが入る（DBはPostgreSQL側）
      - data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login.html', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: confscheduler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を指定してください}
      POSTGRES_DB: confscheduler
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confscheduler"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  data:
  pgdata:
