<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - {{APP_TITLE}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #333;
               display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { background: white; border-radius: 12px; padding: 40px;
                      box-shadow: 0 2px 12px rgba(0,0,0,0.12); width: 100%; max-width: 400px; }
        .login-header { background: #1a73e8; color: white; padding: 20px 24px;
                        border-radius: 8px; margin-bottom: 28px; text-align: center; }
        .login-header h1 { font-size: 1.2rem; margin-bottom: 4px; }
        .login-header p { font-size: 0.85rem; opacity: 0.85; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 12px 14px; border: 1px solid #ccc;
                            border-radius: 6px; font-size: 1rem; }
        .form-group input:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,0.2); }
        .btn-login { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none;
                     border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: 600; }
        .btn-login:hover { background: #1557b0; }
        .btn-login:disabled { background: #999; cursor: not-allowed; }
        .error-msg { color: #d93025; font-size: 0.85rem; margin-top: 12px; text-align: center; display: none; }
        .hp-field { position: absolute; left: -9999px; top: -9999px; opacity: 0; height: 0; width: 0; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h1>{{APP_TITLE}}</h1>
            <p>アクセスにはパスワードが必要です</p>
        </div>
        <form id="loginForm" onsubmit="return handleLogin(event)" autocomplete="off">
            <!-- Honeypot: invisible to humans, bots fill this -->
            <div class="hp-field" aria-hidden="true">
                <label for="email">Email</label>
                <input type="text" id="email" name="email" tabindex="-1" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="password">パスワード</label>
                <input type="password" id="password" placeholder="パスワードを入力" autofocus required>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">ログイン</button>
            <div class="error-msg" id="errorMsg"></div>
        </form>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();

            // Honeypot check — if filled, silently reject (bot)
            if (document.getElementById('email').value) {
                return false;
            }

            const btn = document.getElementById('loginBtn');
            const errEl = document.getElementById('errorMsg');
            const pw = document.getElementById('password').value;

            btn.disabled = true;
            btn.textContent = '確認中...';
            errEl.style.display = 'none';

            try {
                const resp = await fetch('/auth/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pw }),
                });
                if (resp.ok) {
                    window.location.href = '/';
                } else {
                    const data = await resp.json();
                    errEl.textContent = data.detail || 'ログインに失敗しました';
                    errEl.style.display = 'block';
                }
            } catch (err) {
                errEl.textContent = '通信エラーが発生しました';
                errEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'ログイン';
            }
        }
    </script>
</body>
</html>
